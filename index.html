<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>카피바라 스타즈</title><style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Malgun Gothic",sans-serif;background:#17343b;color:#fff4d8;touch-action:none}button,input{font:inherit}button{border:0;cursor:pointer;border-radius:12px;font-weight:900;padding:10px}canvas{display:block;width:100%;height:100%}.hidden{display:none!important}#menu{position:absolute;inset:0;background:radial-gradient(#3d7969,#17343b);z-index:5}.top{height:60px;background:#10272be0;display:flex;align-items:center;justify-content:space-between;padding:9px;gap:8px}.logo{font-size:clamp(17px,4vw,26px);font-weight:1000;color:#ffd65b}.top button{background:#fff0c9;color:#23413a}.grid{height:calc(100% - 60px);display:grid;grid-template-columns:82px 1fr 94px;gap:8px;padding:8px}.nav{display:flex;flex-direction:column;justify-content:center;gap:10px}.nav button{background:#dceac9;color:#26483e;padding:12px 3px;font-size:12px;box-shadow:0 4px #819b76}.stage{position:relative;border-radius:22px;background:radial-gradient(#609775,#244c4e);display:flex;align-items:center;justify-content:center;overflow:hidden}.stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#e7f5c41a 1px,transparent 1px);background-size:22px 22px}.brand{position:absolute;top:10%;font-size:clamp(22px,5vw,38px);font-weight:1000;color:#ffe082;text-shadow:0 4px #9e5c29;white-space:nowrap}.hero{z-index:1;text-align:center;font-weight:900}.hero canvas{width:min(43vw,220px);height:min(45vh,270px)}.right{display:flex;flex-direction:column;gap:10px}.card{background:#17353bd9;border:1px solid #ffffff26;border-radius:13px;padding:8px 3px;text-align:center;font-size:11px}.play{margin-top:auto;background:#ffd65b;color:#493011;font-size:18px;padding:15px 3px;box-shadow:0 5px #b47b2b}.modal{position:absolute;inset:0;z-index:10;background:#06191dcc;display:flex;align-items:center;justify-content:center;padding:15px}.box{width:min(430px,100%);max-height:90%;overflow:auto;background:linear-gradient(145deg,#386b65,#173840);border:2px solid #ffffff32;border-radius:22px;padding:18px}.box h2{color:#ffd65b;margin:0 0 10px}.close{float:right;background:#e4ebd5}.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item p{line-height:1.35;margin:6px 0}.box h3{margin:14px 0 8px;color:#d9f2ca}.item button:disabled{opacity:.48;cursor:default}.item{background:#214a4c;border:1px solid #ffffff2b;border-radius:12px;padding:10px;font-size:12px}.item button{width:100%;margin-top:7px;background:#ffd65b}.field{display:block;margin:10px 0;font-size:12px}.field input{width:100%;padding:11px;margin-top:4px;border-radius:9px;border:0}.primary{width:100%;margin-top:8px;background:#ffd65b;color:#493011}#hud{position:absolute;inset:0;z-index:3;pointer-events:none}.hudtop{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px}.hudbox{background:#10272de8;border-radius:10px;padding:7px;font-size:11px;font-weight:900}.hudtop button{pointer-events:auto;background:#fff0c9;color:#203d39;font-size:10px;padding:8px}#exitGame{position:absolute;top:55px;left:8px;pointer-events:auto;background:#fff0c9;color:#203d39;font-size:11px}#joy{position:absolute;left:17px;bottom:22px;width:112px;height:112px;border-radius:50%;background:#eaffed20;border:2px solid #eaffed70;pointer-events:auto}#knob{position:absolute;left:30px;top:30px;width:48px;height:48px;border-radius:50%;background:#efffe2dc;border:2px solid white}#aimJoy{position:absolute;right:112px;bottom:25px;width:92px;height:92px;border-radius:50%;background:#6dbaff25;border:2px solid #8bd2ffb0;pointer-events:auto;touch-action:none}#aimKnob{position:absolute;left:25px;top:25px;width:38px;height:38px;border-radius:50%;background:#8fd4ffdf;border:2px solid #eaf8ff;box-shadow:0 0 8px #49aaff}#fire{position:absolute;right:17px;bottom:25px;width:78px;height:78px;border-radius:50%;background:#ff9aa8;color:#552330;border:4px solid #ffe2e4;pointer-events:auto}#ult{position:absolute;right:104px;bottom:32px;width:62px;height:62px;border-radius:50%;background:#596365;color:white;pointer-events:auto;font-size:11px}#ult.ready{background:#b46cff;box-shadow:0 0 18px #c58cff}#aimNote{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#10272ddd;border-radius:9px;padding:6px;font-size:10px;white-space:nowrap}
</style></head><body><div id="app"><canvas id="game"></canvas><div id="menu"><div class="top"><div class="logo">🦫 카피바라 스타즈</div><span>🏆 <b id="trophies">0</b></span><button id="loginBtn">로그인</button></div><div class="grid"><div class="nav"><button data-panel="shop">🛒<br>상점</button><button data-panel="inventory">🎒<br>인벤토리</button><button data-panel="missions">📜<br>미션</button><button data-panel="upgrade">⬆️<br>업그레이드</button><button data-panel="team">👥<br>팀 추가</button><button data-panel="mypage">👤<br>마이 페이지</button></div><div class="stage"><div class="brand">CAPYBARA STARS</div><div class="hero"><canvas id="heroCanvas"></canvas><div id="heroName">신입 카피바라</div><small id="heroTag">레벨 1 · 기본 스킨</small><p>🪙 <b id="coins">100</b> 코인</p></div></div><div class="right"><div class="card">⭐ 최고 기록<br><b id="best">0</b> 트로피</div><div class="card">🎁 오늘의 보상<br><span id="rewardStatus">받을 수 있음</span><button id="rewardBtn">받기</button></div><button class="play" id="playBtn">▶ 플레이</button></div></div></div>
<div id="modal" class="modal hidden"><div class="box"><button class="close" id="close">닫기 ✕</button><div id="content"></div></div></div>

<div id="controls" class="hidden"><div id="joy"><div id="knob"></div></div><div id="aimJoy" aria-label="조준 스틱"><div id="aimKnob"></div></div><button id="ult">궁극기<br>0%</button><button id="fire">발사!</button></div>
<div id="end" class="modal hidden"><div class="box" style="text-align:center"><div style="font-size:55px">🦫💫</div><h2 id="endTitle">전투 종료</h2><p id="endText"></p><button class="primary" id="endMenu">메뉴로 돌아가기</button></div></div>
</div><script>
(()=>{const $=id=>document.getElementById(id),c=$('game'),ctx=c.getContext('2d'),hc=$('heroCanvas'),hctx=hc.getContext('2d');let W,H,D=1,running=false,last=0,actors=[],bullets=[],obs=[],p,keys={},joy={x:0,y:0},jid=null,aimJoy={x:0,y:0},ajid=null,held=false,aim={x:0,y:-1},aiming=false,ultAiming=false,ammo=3,reload=0,ult=0,view='top',scoreB=0,scoreR=0,coins=350,trophies=0,best=0,level=1,owned=['기본 스킨'],skin='기본 스킨',upD=0,upS=0,claimed=false,logged=false,user='',mission={plays:0,kills:0,wins:0},claimedM={},ownedChars=['기관단총 카피바라'],character='기관단총 카피바라';const roster={'기관단총 카피바라':{weapon:'기관단총',cost:0,hp:100,damage:18,rate:.28,color:'#b77b4d',desc:'균형형 · 체력 100 / 피해 18'},'샷건 카피바라':{weapon:'샷건',cost:180,hp:78,damage:34,rate:.72,color:'#c18a55',desc:'강한 한 방 · 체력 78 / 피해 34'},'저격총 카피바라':{weapon:'저격총',cost:220,hp:68,damage:42,rate:.95,color:'#8b9eb2',desc:'높은 피해 · 체력 68 / 피해 42'},'기관총 카피바라':{weapon:'기관총',cost:240,hp:92,damage:13,rate:.18,color:'#7b8c55',desc:'연사형 · 체력 92 / 피해 13'},'로켓런처 카피바라':{weapon:'로켓런처',cost:280,hp:62,damage:48,rate:1.1,color:'#b66d58',desc:'폭발적인 피해 · 체력 62 / 피해 48'},'방패 카피바라':{weapon:'방패',cost:200,hp:145,damage:10,rate:.55,color:'#6d9b8c',desc:'튼튼한 방어형 · 체력 145 / 피해 10'},'레이저 카피바라':{weapon:'레이저',cost:260,hp:84,damage:25,rate:.42,color:'#a28bd0',desc:'균형 잡힌 레이저 · 체력 84 / 피해 25'}};const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),len=(x,y)=>Math.hypot(x,y)||1;
function resize(){D=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);hc.width=hc.clientWidth*D;hc.height=hc.clientHeight*D;hctx.setTransform(D,0,0,D,0,0);makeObs();preview()}window.addEventListener('resize',resize);
function rr(g,x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.fill()}
function capy(g,x,y,s,dir,color,hp,am,me=false){g.save();g.translate(x,y);g.scale(s*(dir<0?-1:1),s);g.fillStyle=color;g.beginPath();g.ellipse(0,13,22,8,0,0,7);g.fill();g.fillStyle='#69432d';g.beginPath();g.ellipse(-8,9,5,7,0,0,7);g.ellipse(8,9,5,7,0,0,7);g.fill();g.fillStyle=skin==='우주 카피바라'?'#748fa6':skin==='딸기 카피바라'?'#c78b79':skin==='황금 카피바라'?'#e2b943':skin==='민트 카피바라'?'#75c9b0':skin==='유령 카피바라'?'#d8e7ed':(me&&roster[character]?roster[character].color:'#b77b4d');g.beginPath();g.ellipse(0,-1,15,20,0,0,7);g.fill();g.strokeStyle='#754a30';g.lineWidth=1.5;g.stroke();g.fillStyle='#d4a06c';g.beginPath();g.ellipse(0,0,9,13,0,0,7);g.fill();g.fillStyle='#8a5837';g.beginPath();g.arc(-10,-15,4,0,7);g.arc(10,-15,4,0,7);g.fill();g.strokeStyle='#875532';g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(8,-4);g.lineTo(15,-7);g.moveTo(-8,-4);g.lineTo(-1,-7);g.stroke();rr(g,9,-10,18,6,2,'#34474a');g.fillStyle='#a8c4bd';g.fillRect(23,-9,5,4);g.fillStyle=me?'#50e878':color;g.beginPath();g.moveTo(-8,-10);g.lineTo(8,-10);g.lineTo(4,-5);g.lineTo(-5,-6);g.fill();g.fillStyle='#14272a';g.fillRect(-20,-33,40,6);g.fillStyle=hp>60?'#59e77b':hp>30?'#ffd45b':'#ff4e5d';g.fillRect(-19,-32,38*Math.max(0,hp/100),4);g.strokeStyle='#ffffffb0';g.lineWidth=.6;g.strokeRect(-20,-33,40,6);g.fillStyle='#14272a';g.fillRect(-20,-25,40,4);for(let i=0;i<3;i++){g.fillStyle=i<am?'#ffd65b':'#526365';g.fillRect(-19+i*13.2,-24,11,2)}g.fillStyle='#fff4d8';g.font='bold 6px system-ui';g.textAlign='center';g.fillText(Math.ceil(hp),0,-35);g.restore()}
function preview(){if(!hc.width)return;let w=hc.clientWidth,h=hc.clientHeight;hctx.clearRect(0,0,w,h);capy(hctx,w/2,h*.55,Math.min(w/95,h/150)*1.35,1,'#50e878',100,3,true)}
function obsMake(){obs=[];let a=Math.max(50,W*.12),b=Math.max(36,H*.075);[[.28,.34,1,1],[.59,.28,1,1],[.43,.51,.85,1],[.22,.67,.75,1],[.73,.65,1,1]].forEach(([x,y,ww,hh])=>obs.push({x:x*W-a*ww/2,y:y*H-b*hh/2,w:a*ww,h:b*hh}))}function makeObs(){obsMake()}
function menuUpdate(){$('coins').textContent=coins;$('trophies').textContent=trophies;$('best').textContent=best;$('heroName').textContent=character;$('heroTag').textContent='레벨 '+level+' · '+skin+' 스킨';$('loginBtn').textContent=logged?'로그아웃':'로그인';$('rewardStatus').textContent=claimed?'내일 다시':'받을 수 있음';$('rewardBtn').disabled=claimed;preview()}
function card(name,desc,cost,type){let have=type==='skin'&&owned.includes(name);return `<div class="item"><b>${name}</b><p>${desc}</p>🪙 ${cost}<button data-buy="${name}" data-type="${type}" ${have||coins<cost?'disabled':''}>${have?'보유 중':'구입'}</button></div>`}
function panel(k){let title='',body='';if(k==='team'){title='👥 팀 추가 / 온라인 플레이';body=`<p>친구 ID로 추가하고 함께 플레이하세요.</p><label class=field>친구 ID<input id=friendId placeholder=예시_Capy123></label><button class=primary id=addFriend>친구 추가</button><h3>경기 모드</h3><button class=primary id=friendly>⚔️ 친선경기 · 나 대 친구</button><button class=primary id=normal>🏆 일반경기 · 나와 친구 대 상대</button><p id=teamMsg>현재는 화면 미리보기 모드입니다. 실시간 온라인 대결은 서버 연결 후 활성화됩니다.</p>`}else if(k==='mypage'){title='👤 마이 페이지';body=`<h3>${esc(user||'게스트')}</h3><div class=items><div class=item>👥 친구<br><b id=friendCount>0명</b></div><div class=item>🏆 트로피<br><b>${trophies}</b></div><div class=item>🪙 코인<br><b>${coins}</b></div><div class=item>🔥 연승<br><b>0연승</b></div></div><h3>계정 정보</h3><p>이름: ${esc(user||'게스트')}</p><p>계정 상태: ${logged?'데모 로그인':'게스트'}</p><p>친구 목록과 기록 저장은 서버 연결 전까지 이 브라우저의 데모 정보입니다.</p><button class=primary id=profileLogin>로그인 / 이름 설정</button>`}else if(k==='login'){title=logged?'로그아웃':'로그인';body=logged?`<p>${esc(user)}님으로 로그인되어 있어요.</p><button class="primary" id="logoutNow">로그아웃</button>`:`<p>아이디와 비밀번호를 입력하세요. 이 데모는 비밀번호를 저장하거나 서버로 전송하지 않습니다.</p><label class="field">아이디<input id="u" autocomplete="username"></label><label class="field">비밀번호<input id="pw" type="password" autocomplete="current-password"></label><button class="primary" id="loginNow">로그인</button><p style="font-size:11px">실제 계정 인증은 연결되지 않은 미리보기 기능입니다.</p>`}
if(k==='shop'){title='🛒 상점';body=`<h3>🔫 캐릭터</h3><p style="font-size:12px">무기에 따라 체력과 공격력이 달라요.</p><div class="items">${Object.entries(roster).map(([n,r])=>`<div class="item"><b>${n}</b><p>${r.desc}</p>🪙 ${r.cost}<button data-buy="${n}" data-type="character" ${ownedChars.includes(n)||coins<r.cost?'disabled':''}>${ownedChars.includes(n)?'보유 중':'구입'}</button></div>`).join('')}</div><h3>🎨 스킨</h3><div class="items">${card('딸기 카피바라','분홍빛 스킨',80,'skin')}${card('우주 카피바라','우주 탐험가 스킨',150,'skin')}${card('황금 카피바라','황금빛 스킨',180,'skin')}${card('민트 카피바라','민트빛 스킨',100,'skin')}${card('유령 카피바라','유령 테마 스킨',130,'skin')}${card('파워 업그레이드','공격력 증가',60,'damage')}${card('가벼운 발','이동속도 증가',60,'speed')}</div>`}
if(k==='inventory'){title='🎒 인벤토리';body=`<h3>🦫 캐릭터</h3><div class="items">${ownedChars.map(n=>`<div class="item"><b>${esc(n)}</b><p>${character===n?'현재 선택 중':roster[n].desc}</p><button data-char="${esc(n)}">${character===n?'선택 중':'선택하기'}</button></div>`).join('')}</div><h3>🎨 스킨</h3><div class="items">${owned.map(s=>`<div class="item"><b>${esc(s)}</b><p>${skin===s?'현재 장착 중':'보유 스킨'}</p><button data-equip="${esc(s)}">${skin===s?'장착 중':'장착하기'}</button></div>`).join('')}</div>`}
if(k==='upgrade'){title='⬆️ 업그레이드';body=`<div class="items">${card('공격력 레벨 '+upD,'총알 피해 증가',60,'damage')}${card('이동속도 레벨 '+upS,'이동속도 증가',60,'speed')}</div>`}
if(k==='missions'){title='📜 미션';body=`<div class="items">${missionCard('plays','🎯 전투 참가',1,25)}${missionCard('kills','💥 적 처치',3,40)}${missionCard('wins','🏆 승리하기',1,50)}</div>`}
$('content').innerHTML=`<h2>${title}</h2>${body}`;$('modal').classList.remove('hidden');$('loginNow')?.addEventListener('click',()=>{let u=$('u').value.trim(),pw=$('pw').value;if(!u||!pw){alert('아이디와 비밀번호를 입력해 주세요.');return}logged=true;user=u;$('modal').classList.add('hidden');menuUpdate()});$('logoutNow')?.addEventListener('click',()=>{logged=false;user='';$('modal').classList.add('hidden');menuUpdate()});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy,b.dataset.type));document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{skin=b.dataset.equip;menuUpdate();panel('inventory')});document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{character=b.dataset.char;menuUpdate();panel('inventory')});document.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>{let x=b.dataset.mission,need={plays:1,kills:3,wins:1}[x];if((mission[x]||0)<need||claimedM[x])return;claimedM[x]=true;coins+={plays:25,kills:40,wins:50}[x];menuUpdate();panel('missions')})}
function missionCard(k,name,n,reward){return `<div class="item"><b>${name}</b><p>${mission[k]||0}/${n}</p>보상 ${reward} 코인<button data-mission="${k}" ${(mission[k]||0)<n||claimedM[k]?'disabled':''}>보상 받기</button></div>`}
function buy(n,t){let cost=t==='character'?(roster[n]?.cost||999):t==='skin'?({'딸기 카피바라':80,'우주 카피바라':150,'황금 카피바라':180,'민트 카피바라':100,'유령 카피바라':130}[n]||60):60;if(coins<cost)return;coins-=cost;if(t==='character'){if(!ownedChars.includes(n))ownedChars.push(n);character=n}else if(t==='skin'){if(!owned.includes(n))owned.push(n);skin=n}else if(t==='damage')upD++;else upS++;menuUpdate();panel('shop')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function blocked(x,y,r){return obs.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}function move(a,dx,dy){let nx=clamp(a.x+dx,a.r+7,W-a.r-7),ny=clamp(a.y+dy,62,H-a.r-7);if(!blocked(nx,a.y,a.r))a.x=nx;if(!blocked(a.x,ny,a.r))a.y=ny;if(dx<-.1)a.face=-1;else if(dx>.1)a.face=1}
function nearest(a){let arr=actors.filter(b=>b.alive&&b.team!==a.team),best=null,d0=Infinity;for(let b of arr){let d=Math.hypot(a.x-b.x,a.y-b.y);if(d<d0){best=b;d0=d}}return best}
function fire(a,superShot=false){if(!a.alive||a.fireT>0)return;if(a.player&&!superShot){if(!ammo)return;ammo--;reload=1;hud()}let dx,dy;if(a.player&&(aiming||superShot)){dx=aim.x-a.x;dy=aim.y-a.y}else{let t=nearest(a);if(!t)return;dx=t.x-a.x;dy=t.y-a.y}let l=len(dx,dy);dx/=l;dy/=l;if(a.player)a.face=dx<-.1?-1:dx>.1?1:a.face;let pellets=a.player&&a.weapon==='샷건'?5:1;for(let z=0;z<pellets;z++){let spread=pellets>1?(z-(pellets-1)/2)*.12:0,ca=Math.cos(spread),sa=Math.sin(spread),sx=dx*ca-dy*sa,sy=dx*sa+dy*ca;bullets.push({x:a.x+sx*19,y:a.y+sy*19,vx:sx*(superShot?410:285),vy:sy*(superShot?410:285),team:a.team,owner:a,life:1.5,r:superShot?9:5,damage:(superShot?Math.min(70,(a.damage||22)*1.8):((a.damage||22)+(a.player?upD*4:0)))/(pellets>1?pellets*.72:1)});}a.fireT=superShot?.5:(a.fireRate||.75)}
function lineBlocked(x1,y1,x2,y2){for(let o of obs)for(let i=1;i<8;i++){let t=i/8,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;if(x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)return true}return false}

function setAim(e){let r=c.getBoundingClientRect();aim={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};aiming=true}c.addEventListener('pointerdown',e=>{if(running)setAim(e)});c.addEventListener('pointermove',e=>{if(running&&e.buttons)setAim(e)});
window.addEventListener('keydown',e=>{keys[e.key]=keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.code==='Space'){if(running&&ultAiming){if(ult>=100){fire(p,true);ult=0;ultAiming=false;aiming=false;hud()}else{ultAiming=false;aiming=false}}else held=true}if(e.key==='Shift')dash()});window.addEventListener('keyup',e=>{keys[e.key]=keys[e.key.toLowerCase()]=false;if(e.code==='Space')held=false;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){aiming=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].some(k=>keys[k]);if(!aiming&&!ultAiming)aiming=false}});
const je=$('joy'),kn=$('knob'),aje=$('aimJoy'),akn=$('aimKnob');function setJoy(e){let r=je.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.34,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}joy.x=dx/max;joy.y=dy/max;kn.style.transform=`translate(${dx}px,${dy}px)`}je.onpointerdown=e=>{jid=e.pointerId;je.setPointerCapture(jid);setJoy(e)};je.onpointermove=e=>{if(e.pointerId===jid)setJoy(e)};function release(e){if(e.pointerId===jid){jid=null;joy.x=joy.y=0;kn.style.transform=''}}je.onpointerup=release;je.onpointercancel=release;$('fire').onpointerdown=e=>{held=true;e.preventDefault()};['pointerup','pointercancel','pointerleave'].forEach(v=>$('fire').addEventListener(v,()=>held=false));function setAimJoy(e){let r=aje.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.31,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}aimJoy.x=dx/max;aimJoy.y=dy/max;akn.style.transform=`translate(${dx}px,${dy}px)`;if(Math.hypot(aimJoy.x,aimJoy.y)>.18){aim={x:p.x+aimJoy.x*300,y:p.y+aimJoy.y*300};aiming=true}}aje.onpointerdown=e=>{ajid=e.pointerId;aje.setPointerCapture(ajid);setAimJoy(e);e.preventDefault()};aje.onpointermove=e=>{if(e.pointerId===ajid)setAimJoy(e)};function releaseAim(e){if(e.pointerId===ajid){ajid=null;aimJoy.x=aimJoy.y=0;akn.style.transform='';if(!ultAiming)aiming=false}}aje.onpointerup=releaseAim;aje.onpointercancel=releaseAim;

function update(dt){if(ammo<3){reload-=dt;if(reload<=0){ammo++;reload=1;hud()}}let m=input();if(m.x||m.y)move(p,m.x*p.speed*dt,m.y*p.speed*dt);if(m.x)p.face=m.x<0?-1:1;if(held||keys[' ']){if(ultAiming){if(ult>=100){fire(p,true);ult=0;ultAiming=false;aiming=false;hud()}}else fire(p)}
if(!held&&!keys[' ']){let ax=0,ay=0;if(keys.ArrowLeft)ax--;if(keys.ArrowRight)ax++;if(keys.ArrowUp)ay--;if(keys.ArrowDown)ay++;if(ax||ay){let al=len(ax,ay);aim={x:p.x+ax/al*300,y:p.y+ay/al*300};aiming=true}else if(Math.hypot(aimJoy.x,aimJoy.y)>.18){aim={x:p.x+aimJoy.x*300,y:p.y+aimJoy.y*300};aiming=true}}
for(let a of actors){if(!a.alive){if(a.player){endGame(false,true);return}a.respawn-=dt;if(a.respawn<=0){a.alive=true;a.hp=100;a.x=rand(W*.2,W*.8);a.y=a.team===0?H*.8:rand(H*.1,H*.23)}continue}a.fireT=Math.max(0,a.fireT-dt);if(a.healWait>0)a.healWait-=dt;else a.hp=Math.min(a.maxHp||100,a.hp+((a.maxHp||100)*.07*dt));if(a.player)continue;a.aiT-=dt;if(a.aiT<=0){a.aiT=rand(.25,.5);let t=nearest(a);if(t){let dx=t.x-a.x,dy=t.y-a.y,l=len(dx,dy),f=l>170?1:l<100?-.5:.15,sx=dx/l*f+rand(-.35,.35),sy=dy/l*f+rand(-.35,.35),ll=len(sx,sy);a.mx=sx/ll;a.my=sy/ll;if(!lineBlocked(a.x,a.y,t.x,t.y)&&l<430&&Math.random()<.9)fire(a)}}move(a,a.mx*a.speed*dt,a.my*a.speed*dt)}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let gone=b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H||obs.some(o=>b.x>o.x&&b.x<o.x+o.w&&b.y>o.y&&b.y<o.y+o.h);if(!gone)for(let a of actors){if(!a.alive||a.team===b.team||a===b.owner)continue;if(Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r){a.hp-=b.damage;a.healWait=2.5;gone=true;if(b.owner.player)ult=Math.min(100,ult+14);if(a.hp<=0){a.alive=false;if(a.player){endGame(false,true);return}a.respawn=2.5;if(b.team===0)scoreB++;else scoreR++;if(b.team===0&&a.team===1)mission.kills++;hud();if(scoreB>=10||scoreR>=10){endGame(scoreB>=10);return}}break}}if(gone)bullets.splice(i,1)}hud()}
function arena(){ctx.fillStyle='#2b6053';ctx.fillRect(-W,-H,W*3,H*3);for(let y=0;y<H;y+=34)for(let x=0;x<W;x+=38){ctx.fillStyle='#c2e8a015';ctx.fillRect(x,y,2,3)}ctx.setLineDash([8,10]);ctx.strokeStyle='#e8f4ca55';ctx.beginPath();ctx.moveTo(8,H*.5);ctx.lineTo(W-8,H*.5);ctx.stroke();ctx.setLineDash([]);for(let o of obs){ctx.fillStyle='#143b3b';ctx.fillRect(o.x+4,o.y+5,o.w,o.h);rr(ctx,o.x,o.y,o.w,o.h,8,'#8eaa6d');ctx.fillStyle='#a8c987';ctx.fillRect(o.x+5,o.y+4,o.w-10,5)}for(let b of bullets){ctx.fillStyle=b.team===0?'#3ebaff':'#ff4e58';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}for(let a of actors)if(a.alive)capy(ctx,a.x,a.y,1,a.face,a.player?'#37f56a':a.team===0?'#36aaff':'#ff3e4d',a.hp,a.player?ammo:3,a.player)}
function draw(){ctx.clearRect(0,0,W,H);if(view==='first'){ctx.save();ctx.translate(W/2-p.x,H/2-p.y);arena();ctx.restore();let g=ctx.createLinearGradient(0,H*.5,0,H);g.addColorStop(0,'#102d2800');g.addColorStop(1,'#102d28dd');ctx.fillStyle=g;ctx.fillRect(0,H*.5,W,H*.5);ctx.fillStyle='#b77b4d';ctx.beginPath();ctx.ellipse(W/2,H+25,43,60,0,0,7);ctx.fill();rr(ctx,W/2+10,H-75,62,16,4,'#34474a');ctx.strokeStyle='white';ctx.beginPath();ctx.moveTo(W/2-10,H/2);ctx.lineTo(W/2+10,H/2);ctx.moveTo(W/2,H/2-10);ctx.lineTo(W/2,H/2+10);ctx.stroke()}else arena();if(aiming&&p&&p.alive){let dx=aim.x-p.x,dy=aim.y-p.y,L=Math.hypot(dx,dy)||1,ex=p.x+dx/L*Math.min(240,L),ey=p.y+dy/L*Math.min(240,L);ctx.save();ctx.strokeStyle='#8de1ff';ctx.lineWidth=2;ctx.setLineDash([8,5]);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(ex,ey,13,0,Math.PI*2);ctx.moveTo(ex-19,ey);ctx.lineTo(ex+19,ey);ctx.moveTo(ex,ey-19);ctx.lineTo(ex,ey+19);ctx.stroke();ctx.fillStyle='#d9f7ff';ctx.font='bold 11px system-ui';ctx.fillText('조준',ex+16,ey-14);ctx.restore()}}
