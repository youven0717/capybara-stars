:32px;width:62px;height:62px;border-radius:50%;background:#596365;color:white;pointer-events:auto;font-size:11px}#ult.ready{background:#b46cff;box-shadow:0 0 18px #c58cff}#aimNote{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#10272ddd;border-radius:9px;padding:6px;font-size:10px;white-space:nowrap}

</div><script>
(()=>{const $=id=>document.getElementById(id),c=$('game'),ctx=c.getContext('2d'),hc=$('heroCanvas'),hctx=hc.getContext('2d');let W,H,D=1,running=false,last=0,actors=[],bullets=[],obs=[],p,keys={},joy={x:0,y:0},jid=null,aimJoy={x:0,y:0},ajid=null,held=false,aim={x:0,y:-1},aiming=false,ultAiming=false,ammo=3,reload=0,ult=0,view='top',scoreB=0,scoreR=0,coins=350,trophies=0,best=0,level=1,owned=['기본 스킨'],skin='기본 스킨',upD=0,upS=0,claimed=false,logged=false,user='',mission={plays:0,kills:0,wins:0},claimedM={},ownedChars=['기관단총 카피바라'],character='기관단총 카피바라',itemInventory=[],equippedWeapon='',equippedItems={ammo:null,speed:null,defense:null,attack:null};const roster={'기관단총 카피바라':{weapon:'기관단총',cost:0,hp:100,damage:18,rate:.28,color:'#b77b4d',desc:'균형형 · 체력 100 / 피해 18'},'샷건 카피바라':{weapon:'샷건',cost:180,hp:78,damage:34,rate:.72,color:'#c18a55',desc:'강한 한 방 · 체력 78 / 피해 34'},'저격총 카피바라':{weapon:'저격총',cost:220,hp:68,damage:42,rate:.95,color:'#8b9eb2',desc:'높은 피해 · 체력 68 / 피해 42'},'기관총 카피바라':{weapon:'기관총',cost:240,hp:92,damage:13,rate:.18,color:'#7b8c55',desc:'연사형 · 체력 92 / 피해 13'},'로켓런처 카피바라':{weapon:'로켓런처',cost:280,hp:62,damage:48,rate:1.1,color:'#b66d58',desc:'폭발적인 피해 · 체력 62 / 피해 48'},'방패 카피바라':{weapon:'방패',cost:200,hp:145,damage:10,rate:.55,color:'#6d9b8c',desc:'튼튼한 방어형 · 체력 145 / 피해 10'},'레이저 카피바라':{weapon:'레이저',cost:260,hp:84,damage:25,rate:.42,color:'#a28bd0',desc:'균형 잡힌 레이저 · 체력 84 / 피해 25'},'검객 카피바라':{weapon:'근접',cost:300,hp:120,damage:32,rate:.55,color:'#7bc6d0',desc:'넓은 부채꼴 칼베기 · 체력 120 / 근접 피해 32'},'투척수 카피바라':{weapon:'투척',cost:320,hp:82,damage:28,rate:.85,color:'#e6ad62',desc:'포물선 투척 · 체력 82 / 피해 28'},'힐러 카피바라':{weapon:'힐러',cost:340,hp:105,damage:18,rate:.75,color:'#79d6b0',desc:'웅덩이로 아군 치유·적 독 피해 · 체력 105'},'시리우스':{weapon:'성운 블래스터',cost:1200,hp:200,damage:50,rate:.34,color:'#24213f',desc:'슈퍼 울트라 · 체력 200 / 공격력 50 · 처치한 적의 분신을 소환'}};const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),len=(x,y)=>Math.hypot(x,y)||1;
function resize(){D=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);hc.width=hc.clientWidth*D;hc.height=hc.clientHeight*D;hctx.setTransform(D,0,0,D,0,0);makeObs();preview()}window.addEventListener('resize',resize);
function rr(g,x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.fill()}
function capy(g,x,y,s,dir,color,hp,am,me=false){g.save();g.translate(x,y);g.scale(s*(dir<0?-1:1),s);g.fillStyle=color;g.beginPath();g.ellipse(0,13,22,8,0,0,7);g.fill();g.fillStyle='#69432d';g.beginPath();g.ellipse(-8,9,5,7,0,0,7);g.ellipse(8,9,5,7,0,0,7);g.fill();g.fillStyle=skin==='우주 카피바라'?'#748fa6':skin==='딸기 카피바라'?'#c78b79':skin==='황금 카피바라'?'#e2b943':skin==='민트 카피바라'?'#75c9b0':skin==='유령 카피바라'?'#d8e7ed':(me&&roster[character]?roster[character].color:'#b77b4d');g.beginPath();g.ellipse(0,-1,15,20,0,0,7);g.fill();g.strokeStyle='#754a30';g.lineWidth=1.5;g.stroke();g.fillStyle='#d4a06c';g.beginPath();g.ellipse(0,0,9,13,0,0,7);g.fill();g.fillStyle='#8a5837';g.beginPath();g.arc(-10,-15,4,0,7);g.arc(10,-15,4,0,7);g.fill();g.strokeStyle='#875532';g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(8,-4);g.lineTo(15,-7);g.moveTo(-8,-4);g.lineTo(-1,-7);g.stroke();if(!(me&&roster[character]&&['근접','투척','힐러'].includes(roster[character].weapon))){rr(g,9,-10+(held?-1:0),18,6,2,'#34474a');g.fillStyle='#a8c4bd';g.fillRect(23,-9+(held?-1:0),5,4);}g.fillStyle=me?'#50e878':color;g.beginPath();g.moveTo(-8,-10);g.lineTo(8,-10);g.lineTo(4,-5);g.lineTo(-5,-6);g.fill();g.fillStyle='#14272a';g.fillRect(-20,-33,40,6);g.fillStyle=hp>60?'#59e77b':hp>30?'#ffd45b':'#ff4e5d';g.fillRect(-19,-32,38*Math.max(0,hp/100),4);g.strokeStyle='#ffffffb0';g.lineWidth=.6;g.strokeRect(-20,-33,40,6);g.fillStyle='#14272a';g.fillRect(-20,-25,40,4);for(let i=0;i<3;i++){g.fillStyle=i<am?'#ffd65b':'#526365';g.fillRect(-19+i*13.2,-24,11,2)}g.fillStyle='#fff4d8';g.font='bold 6px system-ui';g.textAlign='center';g.fillText(Math.ceil(hp),0,-35);g.restore()}
function preview(){if(!hc.width)return;let w=hc.clientWidth,h=hc.clientHeight;hctx.clearRect(0,0,w,h);capy(hctx,w/2,h*.55,Math.min(w/95,h/150)*1.35,1,'#50e878',100,3,true)}
function obsMake(){obs=[];let a=Math.max(50,W*.12),b=Math.max(36,H*.075);[[.28,.34,1,1],[.59,.28,1,1],[.43,.51,.85,1],[.22,.67,.75,1],[.73,.65,1,1]].forEach(([x,y,ww,hh])=>obs.push({x:x*W-a*ww/2,y:y*H-b*hh/2,w:a*ww,h:b*hh}))}function makeObs(){obsMake()}
function menuUpdate(){$('coins').textContent=coins;$('trophies').textContent=trophies;$('best').textContent=best;$('heroName').textContent=character;$('heroTag').textContent='레벨 '+level+' · '+skin+' 스킨';$('loginBtn').textContent=logged?'로그아웃':'로그인';$('rewardStatus').textContent=claimed?'내일 다시':'받을 수 있음';$('rewardBtn').disabled=claimed;preview()}
function card(name,desc,cost,type){let have=type==='skin'&&owned.includes(name);return `<div class="item"><b>${name}</b><p>${desc}</p>🪙 ${cost}<button data-buy="${name}" data-type="${type}" ${have||coins<cost?'disabled':''}>${have?'보유 중':'구입'}</button></div>`}

if(k==='shop'){title='🛒 상점';body=`<h3>🎁 랜덤 아이템 상자</h3><p>상자 하나에 100코인! 탄창·속도·방어력·공격력 강화 또는 공격력을 높여 주는 무기가 나와요.</p><div class=items><div class=item><b>🎁 랜덤 상자</b><p>강화 아이템 또는 무기 1개 획득</p>🪙 100<button id=buyBox ${coins<100?'disabled':''}>상자 열기</button></div></div><div id=boxResult></div><h3>🔫 캐릭터</h3><p style="font-size:12px">무기에 따라 체력과 공격력이 달라요.</p><div class="items">${Object.entries(roster).map(([n,r])=>`<div class="item"><b>${n}</b><p>${r.desc}</p>🪙 ${r.cost}<button data-buy="${n}" data-type="character" ${ownedChars.includes(n)||coins<r.cost?'disabled':''}>${ownedChars.includes(n)?'보유 중':'구입'}</button></div>`).join('')}</div><h3>🎨 스킨</h3><div class="items">${card('딸기 카피바라','분홍빛 스킨',80,'skin')}${card('우주 카피바라','우주 탐험가 스킨',150,'skin')}${card('황금 카피바라','황금빛 스킨',180,'skin')}${card('민트 카피바라','민트빛 스킨',100,'skin')}${card('유령 카피바라','유령 테마 스킨',130,'skin')}${card('파워 업그레이드','공격력 증가',60,'damage')}${card('가벼운 발','이동속도 증가',60,'speed')}</div>`}

function buy(n,t){let cost=t==='character'?(roster[n]?.cost||999):t==='skin'?({'딸기 카피바라':80,'우주 카피바라':150,'황금 카피바라':180,'민트 카피바라':100,'유령 카피바라':130}[n]||60):60;if(coins<cost)return;coins-=cost;if(t==='character'){if(!ownedChars.includes(n))ownedChars.push(n);character=n}else if(t==='skin'){if(!owned.includes(n))owned.push(n);skin=n}else if(t==='damage')upD++;else upS++;menuUpdate();panel('shop')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function blocked(x,y,r){return obs.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}function move(a,dx,dy){let nx=clamp(a.x+dx,a.r+7,W-a.r-7),ny=clamp(a.y+dy,62,H-a.r-7);if(!blocked(nx,a.y,a.r))a.x=nx;if(!blocked(a.x,ny,a.r))a.y=ny;if(dx<-.1)a.face=-1;else if(dx>.1)a.face=1}

const je=$('joy'),kn=$('knob'),aje=$('aimJoy'),akn=$('aimKnob');function setJoy(e){let r=je.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.34,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}joy.x=dx/max;joy.y=dy/max;kn.style.transform=`translate(${dx}px,${dy}px)`}je.onpointerdown=e=>{jid=e.pointerId;je.setPointerCapture(jid);setJoy(e)};je.onpointermove=e=>{if(e.pointerId===jid)setJoy(e)};function release(e){if(e.pointerId===jid){jid=null;joy.x=joy.y=0;kn.style.transform=''}}je.onpointerup=release;je.onpointercancel=release;$('fire').onpointerdown=e=>{held=true;e.preventDefault()};['pointerup','pointercancel','pointerleave'].forEach(v=>$('fire').addEventListener(v,()=>held=false));function setAimJoy(e){let r=aje.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.31,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}aimJoy.x=dx/max;aimJoy.y=dy/max;akn.style.transform=`translate(${dx}px,${dy}px)`;if(Math.hypot(aimJoy.x,aimJoy.y)>.18){aim={x:p.x+aimJoy.x*300,y:p.y+aimJoy.y*300};aiming=true}}aje.onpointerdown=e=>{ajid=e.pointerId;aje.setPointerCapture(ajid);setAimJoy(e);e.preventDefault()};aje.onpointermove=e=>{if(e.pointerId===ajid)setAimJoy(e)};function releaseAim(e){if(e.pointerId===ajid){ajid=null;aimJoy.x=aimJoy.y=0;akn.style.transform='';if(!ultAiming)aiming=false}}aje.onpointerup=releaseAim;aje.onpointercancel=releaseAim;
